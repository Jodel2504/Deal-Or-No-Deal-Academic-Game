<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deal or No Deal Academic</title><style>
:root{--bg:#07091a;--panel:#111830;--gold:#ffd700;--blue:#00bfff;--green:#39ff14;--red:#ff3b3b;--text:#eef;--dim:#8790c7}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#18204a,#07091a 65%);color:var(--text);font:16px Arial,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--gold);background:#1a2348;color:var(--gold);padding:12px 18px;border-radius:8px;font-weight:bold}button:hover{filter:brightness(1.3)}button:disabled{opacity:.5;cursor:not-allowed}.blue{border-color:var(--blue);color:var(--blue)}.green{border-color:var(--green);color:var(--green)}.red{border-color:var(--red);color:var(--red)}.screen{display:none;min-height:100vh;padding:24px;align-items:center;justify-content:center}.screen.active{display:flex}.card{background:rgba(17,24,48,.96);border:2px solid var(--gold);border-radius:18px;padding:28px;max-width:900px;width:100%;box-shadow:0 0 35px #f90a}.narrow{max-width:520px}.title{text-align:center;color:var(--gold);font-size:clamp(2rem,6vw,4rem);font-weight:900;letter-spacing:3px}.sub{text-align:center;color:var(--blue);margin:8px 0 24px}.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}.col{display:flex;flex-direction:column;gap:12px}.section{border:1px solid #2b3c87;border-radius:12px;padding:18px;margin:14px 0}.section h3{margin:0 0 12px;color:var(--blue);text-align:center}input,select{width:100%;background:#080d22;color:var(--text);border:1px solid #40519b;border-radius:7px;padding:12px}.label{color:var(--dim);font-size:.85rem}.hint{color:var(--dim);font-size:.9rem}.status{min-height:24px;color:var(--green);margin:8px 0}.danger{color:var(--red)}.topbar{position:fixed;top:0;left:0;right:0;background:#080d22ee;border-bottom:1px solid var(--gold);padding:10px 14px;display:flex;justify-content:space-between;z-index:5}.game{padding-top:70px;align-items:flex-start}.cases{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;margin:20px auto;max-width:700px}.case{aspect-ratio:1;background:#18234b;border:2px solid #40519b;color:#fff;border-radius:9px;font-weight:bold}.case.open{opacity:.35;text-decoration:line-through}.timer{font-size:1.5rem;color:var(--blue)}.timer.warn{color:var(--red)}.modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal.show{display:flex}.modalbox{background:var(--panel);border:2px solid var(--gold);border-radius:14px;padding:24px;max-width:680px;width:100%;max-height:90vh;overflow:auto}.q{font-size:1.2rem;line-height:1.5;margin:16px 0}.answer{width:100%;text-align:left;margin:5px 0}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}.stat{background:#080d22;border-radius:8px;padding:14px;text-align:center}.stat b{display:block;color:var(--gold);font-size:1.4rem;margin-top:5px}@media(max-width:600px){.cases{grid-template-columns:repeat(5,1fr)}.card{padding:18px}.screen{padding:12px}}
</style></head><body>
<section id="menu" class="screen active"><div class="card"><div class="title">DEAL OR NO DEAL</div><div class="sub">ACADEMIC EDITION</div><div class="section"><h3>PLAY</h3><div class="row"><button onclick="soloSetup()">▶ SOLO MODE</button><button class="blue" onclick="mpSetup()">👥 MULTIPLAYER</button></div></div><div class="section"><h3>PROGRESS</h3><div class="row"><button class="green" onclick="showHistory()">📋 HISTORY</button><button onclick="showAchievements()">🏅 ACHIEVEMENTS</button><button class="blue" onclick="showLeaderboard()">🏆 LEADERBOARD</button></div></div></div></section>
<section id="soloSetup" class="screen"><div class="card narrow"><h2>SOLO PLAYER SETUP</h2><input id="soloName" placeholder="Your name" maxlength="30"><div class="section"><label><input id="soloTimer" type="checkbox" checked> Enable question timer</label><input id="soloSeconds" type="number" min="5" max="300" value="30"><span class="hint">seconds per question</span></div><div class="row"><button onclick="beginSolo()">CONTINUE</button><button class="blue" onclick="go('menu')">← BACK</button></div></div></section>
<section id="mpSetup" class="screen"><div class="card narrow"><h2>MULTIPLAYER</h2><div class="row"><button onclick="mpRole('host')">🏫 HOST / TEACHER</button><button class="blue" onclick="mpRole('player')">🎮 STUDENT</button></div><div id="mpRoleArea" class="section"></div><button class="blue" onclick="go('menu')">← BACK</button></div></section>
<section id="choose" class="screen"><div class="card"><h2>CHOOSE YOUR CASE</h2><div id="chooseGrid" class="cases"></div><button class="blue" onclick="go('soloSetup')">← BACK</button></div></section>
<section id="game" class="screen game"><div class="topbar"><span id="who"></span><span>Score: <b id="score">0</b> · <span id="clock" class="timer"></span></span><button class="red" onclick="quitGame()">EXIT</button></div><div class="card"><h2 id="gameHeading">GAME</h2><p id="gameHint" class="hint"></p><div id="gameCases" class="cases"></div><button id="finishBtn" onclick="finishGame()" class="green" style="display:none">FINISH GAME</button></div></section>
<section id="result" class="screen"><div class="card narrow"><h2>RESULTS</h2><div id="resultStats" class="stats"></div><div id="achResult" class="section"></div><div class="row"><button onclick="go('menu')">MAIN MENU</button><button class="blue" onclick="replay()">PLAY AGAIN</button></div></div></section>
<div id="modal" class="modal"><div class="modalbox"><button class="red" style="float:right" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>
<script>
const S={mode:'solo',name:'',cases:[],chosen:-1,opened:[],score:0,qIndex:0,timer:false,seconds:30,timerId:null,ws:null,role:'',room:'',playerId:'',hostStarted:false,roomPlayers:[],result:null};
const Q=[{q:'What is 2 + 2?',a:['3','4','5','6'],c:1},{q:'What is the capital of France?',a:['Rome','Paris','Madrid','Berlin'],c:1},{q:'Which planet is called the Red Planet?',a:['Earth','Venus','Mars','Jupiter'],c:2},{q:'What is H₂O?',a:['Oxygen','Hydrogen','Water','Salt'],c:2}];
const values=[1,5,10,25,50,100,250,500,1000,2500,5000,10000];
function $(id){return document.getElementById(id)}function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}function msg(t,err=false){$('mpRoleArea').innerHTML='<p class="'+(err?'danger':'status')+'">'+esc(t)+'</p>'}function esc(s){return String(s||'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function toast(t){alert(t)}
function makeCases(){let a=[];for(let i=0;i<30;i++)a.push({n:i+1,value:values[i%values.length]});return a.sort(()=>Math.random()-.5)}function soloSetup(){go('soloSetup');$('soloName').focus()}function beginSolo(){let n=$('soloName').value.trim();if(n.length<2)return toast('Enter your name');S.mode='solo';S.name=n;S.timer=$('soloTimer').checked;S.seconds=clamp($('soloSeconds').value,5,300);S.cases=makeCases();S.opened=[];S.score=0;S.chosen=-1;renderChoose();go('choose')}function clamp(v,min,max){return Math.max(min,Math.min(max,Number(v)||min))}function renderChoose(){let g=$('chooseGrid');g.innerHTML='';S.cases.forEach((c,i)=>{let b=document.createElement('button');b.className='case';b.innerHTML='💼<br>'+c.n;b.onclick=()=>{S.chosen=i;startPlay()};g.appendChild(b)})}
function startPlay(){go('game');$('who').textContent=S.name;$('gameHeading').textContent=S.mode==='host'?'HOST GAME':'DEAL OR NO DEAL';$('gameHint').textContent=S.mode==='player'?'Wait for the host to start the game.':'Open cases; questions appear every 3 cases.';renderCases();if(S.mode==='solo')S.hostStarted=true;if(S.hostStarted)enablePlay()}function renderCases(){let g=$('gameCases');g.innerHTML='';S.cases.forEach((c,i)=>{if(i===S.chosen)return;let b=document.createElement('button');b.className='case '+(S.opened.includes(i)?'open':'');b.innerHTML='💼<br>'+c.n+(S.opened.includes(i)?'<br>$'+c.value:'');b.disabled=S.opened.includes(i)||!S.hostStarted;b.onclick=()=>openCase(i);g.appendChild(b)});$('score').textContent=S.score;$('finishBtn').style.display=S.hostStarted?'inline-block':'none'}function enablePlay(){S.hostStarted=true;$('gameHint').textContent='Open cases; answer each academic question.';renderCases()}
function openCase(i){if(!S.hostStarted||S.opened.includes(i))return;S.opened.push(i);S.score+=10;if(S.mode==='player')send({type:'player_update',status:'playing',score:S.score,opened:S.opened.length});renderCases();if(S.opened.length%3===0)askQuestion()}function askQuestion(){let q=Q[S.qIndex++%Q.length];let h='<h2>Academic Question</h2><div class="q">'+esc(q.q)+'</div>';q.a.forEach((a,i)=>h+='<button class="answer" onclick="answer('+i+','+q.c+')">'+esc(a)+'</button>');$('modalContent').innerHTML=h;openModal();if(S.timer)startTimer()}function answer(i,c){document.querySelectorAll('.answer').forEach(b=>b.disabled=true);if(i===c){S.score+=50;toast('Correct! +50 points')}else toast('Incorrect');stopTimer();$('modalContent').insertAdjacentHTML('beforeend','<button onclick="closeModal()">CONTINUE</button>');renderCases()}function startTimer(){stopTimer();let n=S.seconds;$('clock').textContent=n+'s';$('clock').classList.remove('warn');S.timerId=setInterval(()=>{n--;$('clock').textContent=n+'s';if(n<=5)$('clock').classList.add('warn');if(n<=0){stopTimer();closeModal()}},1000)}function stopTimer(){if(S.timerId)clearInterval(S.timerId);S.timerId=null;$('clock').textContent=''}function openModal(){$('modal').classList.add('show')}function closeModal(){$('modal').classList.remove('show');stopTimer()}
function finishGame(){let val=S.cases[S.chosen]?.value||0;S.result={value:val,score:S.score,name:S.name,mode:S.mode,date:new Date().toISOString()};if(S.mode==='player')send({type:'player_result',caseVal:'$'+val,final:'$'+val,pts:String(S.score),ptsNum:S.score,errors:0,winner:'student',gameId:Date.now()});saveResult(S.result);$('resultStats').innerHTML='<div class="stat">Case value<b>$'+val+'</b></div><div class="stat">Points<b>'+S.score+'</b></div><div class="stat">Cases opened<b>'+S.opened.length+'</b></div>';let a=S.score>=150?'🏅 Academic Achiever unlocked!':'Keep playing to unlock achievements.';$('achResult').textContent=a;go('result')}function quitGame(){if(confirm('Leave this game?')){stopTimer();if(S.ws)send({type:'host_end'});go('menu')}}function replay(){if(S.mode==='solo')beginSolo();else go('mpSetup')}
function saveResult(r){let h=JSON.parse(localStorage.getItem('dond.history')||'[]');h.push(r);localStorage.setItem('dond.history',JSON.stringify(h.slice(-100)));if(r.score>=150)localStorage.setItem('dond.achiever','1')}function showHistory(){let h=JSON.parse(localStorage.getItem('dond.history')||'[]');let x='<h2>HISTORY</h2>'+(h.length?h.slice().reverse().map(r=>'<p>'+esc(r.name)+' — $'+r.value+' — '+r.score+' pts — '+new Date(r.date).toLocaleString()+'</p>').join(''):'<p>No games recorded yet.</p>');$('modalContent').innerHTML=x;openModal()}function showAchievements(){$('modalContent').innerHTML='<h2>ACHIEVEMENTS</h2><p>'+(localStorage.getItem('dond.achiever')?'🏅 Academic Achiever — unlocked':'🔒 Academic Achiever — score 150 points in a game')+'</p>';openModal()}function showLeaderboard(){let h=JSON.parse(localStorage.getItem('dond.history')||'[]').sort((a,b)=>b.score-a.score);$('modalContent').innerHTML='<h2>LEADERBOARD</h2>'+(h.length?h.slice(0,10).map((r,i)=>'<p>#'+(i+1)+' '+esc(r.name)+' — '+r.score+' pts</p>').join(''):'<p>No scores yet.</p>');openModal()}
function mpSetup(){go('mpSetup');mpRole('player')}function mpRole(role){S.role=role;S.mode=role;let x='';if(role==='host')x='<h3>HOST SETUP</h3><input id="room" placeholder="Room code (3-8 letters)" maxlength="8"><input id="group" placeholder="Class/group name" value="Classroom"><label><input id="mpTimer" type="checkbox" checked> Enable per-question timer</label><input id="mpSeconds" type="number" min="5" max="300" value="30"><button onclick="createRoom()">CREATE ROOM</button><div id="hostInfo"></div>';else x='<h3>STUDENT JOIN</h3><input id="room" placeholder="Room code"><input id="student" placeholder="Your name"><button class="blue" onclick="joinRoom()">CHECK & JOIN</button>';$('mpRoleArea').innerHTML=x;let p=new URLSearchParams(location.search).get('studentJoin');if(role==='player'&&p)$('room').value=p.toUpperCase()}
function wsUrl(){return(location.protocol==='https:'?'wss://':'ws://')+location.host}function connect(){return new Promise((resolve,reject)=>{if(S.ws&&S.ws.readyState===1)return resolve();S.ws=new WebSocket(wsUrl());S.ws.onopen=()=>resolve();S.ws.onerror=()=>reject(new Error('WebSocket connection failed'));S.ws.onmessage=e=>onMessage(JSON.parse(e.data));S.ws.onclose=()=>{if(S.mode==='player')msg('Disconnected from host',true)}})}function send(m){if(S.ws?.readyState===1)S.ws.send(JSON.stringify(m))}async function createRoom(){S.room=($('room').value.trim()||Math.random().toString(36).slice(2,8)).toUpperCase();S.name='Host';S.timer=$('mpTimer').checked;S.seconds=clamp($('mpSeconds').value,5,300);try{await connect();send({type:'host_create',roomId:S.room,groupName:$('group').value,timerEnabled:S.timer,timerSeconds:S.seconds});}catch(e){msg(e.message,true)}}async function joinRoom(){S.room=$('room').value.trim().toUpperCase();S.name=$('student').value.trim();if(S.room.length<3||S.name.length<2)return msg('Enter a valid room code and name',true);try{await connect();send({type:'room_check',roomId:S.room})}catch(e){msg(e.message,true)}}function onMessage(m){if(m.type==='error')return msg(m.msg,true);if(m.type==='host_created'){S.role='host';S.mode='host';S.name='Host';S.hostStarted=false;S.timer=m.info?.timer?.enabled||S.timer;S.seconds=m.info?.timer?.seconds||S.seconds;startHostDashboard(m.info)}if(m.type==='room_ok'){S.timer=m.timer?.enabled;S.seconds=m.timer?.seconds||30;send({type:'player_join',roomId:S.room,playerName:S.name});msg('Joining '+m.groupName+'…')}if(m.type==='player_joined'){S.playerId=m.playerId;S.timer=m.timer?.enabled;S.seconds=m.timer?.seconds||30;startPlay();if(m.started)enablePlay()}if(m.type==='host_message'){if(m.payload?.cmd==='start_game'){S.timer=!!m.payload.timer?.enabled;S.seconds=m.payload.timer?.seconds||30;enablePlay()}}if(m.type==='room_info'&&S.role==='host')updateHost(m.info)}function startHostDashboard(i){go('game');$('who').textContent='HOST · '+S.room;$('gameHint').textContent='Waiting for students…';$('gameCases').innerHTML='<div class="section" id="hostPlayers">Waiting for students…</div>';let b=document.createElement('button');b.textContent='▶ START GAME FOR ALL';b.onclick=()=>{S.hostStarted=true;send({type:'host_broadcast',payload:{cmd:'start_game',timer:{enabled:S.timer,seconds:S.seconds}}});enablePlay()};$('gameCases').appendChild(b)}function updateHost(i){let e=$('hostPlayers');if(e)e.innerHTML=(i.players||[]).map(p=>'<p>'+esc(p.name)+' — '+p.status+' — '+p.score+' pts</p>').join('')||'Waiting for students…'}
(function(){let p=new URLSearchParams(location.search).get('studentJoin');if(p)window.addEventListener('DOMContentLoaded',()=>{mpSetup();mpRole('player')})})();
</script></body></html>
